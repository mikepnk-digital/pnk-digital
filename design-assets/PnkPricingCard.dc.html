<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<article aria-label="{{ plan.name }} plan" style="position:relative; height:100%; box-sizing:border-box; background:#fff; border:1px solid #e7e2de; border-radius:24px; padding:36px 28px 32px; display:flex; flex-direction:column; gap:22px; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:#1b1720;">
  <sc-if value="{{ plan.popular }}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position:absolute; inset:-2px; border:3px solid #ec008c; border-radius:26px; pointer-events:none;"></div>
    <span style="position:absolute; top:-15px; left:26px; background:#b3006b; color:#fff; font-size:14px; font-weight:800; letter-spacing:0.02em; padding:6px 14px; border-radius:999px;">Most popular</span>
  </sc-if>
  <div style="display:flex; flex-direction:column; gap:8px;">
    <h3 style="margin:0; font-size:26px; font-weight:800; letter-spacing:-0.02em;">{{ plan.name }}</h3>
    <p style="margin:0; font-size:16px; line-height:1.5; color:#4a4550; text-wrap:pretty;">{{ plan.tagline }}</p>
  </div>
  <div style="display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;">
    <sc-if value="{{ plan.from }}"><span style="font-size:17px; font-weight:600; color:#4a4550;">from</span></sc-if>
    <span style="font-size:48px; font-weight:800; letter-spacing:-0.035em; line-height:1;">£{{ plan.price }}</span>
    <span style="font-size:17px; font-weight:600; color:#4a4550;">/month</span>
  </div>
  <ul style="list-style:none; margin:0; padding:16px 18px; background:#faf7f5; border-radius:14px; display:flex; flex-direction:column; gap:8px; font-size:15px; font-weight:700;">
    <li style="display:flex; gap:10px; align-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b1720" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ plan.hours }}</li>
    <li style="display:flex; gap:10px; align-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b1720" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h12M12 6l6 6-6 6"></path></svg>{{ plan.response }}</li>
  </ul>
  <div style="display:flex; flex-direction:column; gap:10px;">
    <sc-if value="{{ plan.popular }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ plan.select }}" aria-label="Book a free tech review, {{ plan.name }} plan" style="appearance:none; border:0; cursor:pointer; width:100%; background:#ec008c; color:#fff; font-family:inherit; font-size:19px; font-weight:700; padding:15px 20px; border-radius:999px; min-height:56px;" style-hover="background:#c8007a;" style-focus="outline:3px solid #1b1720; outline-offset:3px;">Book a free tech review</button>
    </sc-if>
    <sc-if value="{{ plan.notPopular }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ plan.select }}" aria-label="Book a free tech review, {{ plan.name }} plan" style="appearance:none; cursor:pointer; width:100%; background:#fff; color:#1b1720; border:2px solid #1b1720; font-family:inherit; font-size:19px; font-weight:700; padding:13px 20px; border-radius:999px; min-height:56px;" style-hover="background:#1b1720; color:#fff;" style-focus="outline:3px solid #ec008c; outline-offset:3px;">Book a free tech review</button>
    </sc-if>
    <p style="margin:0; text-align:center; font-size:14px; color:#4a4550;">We'll confirm the right plan on the call</p>
  </div>
  <div style="border-top:1px solid #eee7e2; padding-top:20px; display:flex; flex-direction:column; gap:14px;">
    <sc-if value="{{ plan.includes }}"><p style="margin:0; font-size:15px; font-weight:800;">{{ plan.includes }}</p></sc-if>
    <ul style="list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;">
      <sc-for list="{{ plan.features }}" as="ft" hint-placeholder-count="5">
        <li style="display:flex; gap:10px; align-items:flex-start; font-size:16px; line-height:1.45;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b3006b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none; margin-top:3px;"><path d="m5 12 5 5 9-10"></path></svg><span>{{ ft }}</span></li>
      </sc-for>
    </ul>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:760},&quot;plan&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string;tagline:string;price:string;from?:boolean;hours:string;response:string;includes?:string;features:string[];popular?:boolean;notPopular?:boolean;select:()=&gt;void}&quot;,&quot;default&quot;:{&quot;name&quot;:&quot;Growth&quot;,&quot;tagline&quot;:&quot;For teams that rely on email and Microsoft 365 or Google Workspace every day.&quot;,&quot;price&quot;:&quot;375&quot;,&quot;hours&quot;:&quot;Up to 4 hours a month&quot;,&quot;response&quot;:&quot;Same business day response&quot;,&quot;includes&quot;:&quot;Everything in Essentials, plus:&quot;,&quot;features&quot;:[&quot;Microsoft 365 or Google Workspace admin&quot;],&quot;popular&quot;:true}}}"></script>
</body>
</html>
