<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:#1b1720;">
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <div role="table" aria-label="Compare plans" style="border:1px solid #e7e2de; border-radius:20px; overflow:hidden; background:#fff;">
      <div role="row" style="display:grid; grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr)); border-bottom:1px solid #e7e2de;">
        <div role="columnheader" style="padding:22px 24px; font-size:15px; font-weight:700; color:#4a4550; display:flex; align-items:flex-end;">What's included</div>
        <sc-for list="{{ head }}" as="h" hint-placeholder-count="3">
          <div role="columnheader" style="padding:22px 16px; text-align:center; background:{{ h.bg }};">
            <div style="font-size:19px; font-weight:800;">{{ h.name }}</div>
            <div style="font-size:15px; font-weight:600; color:#4a4550; margin-top:2px;">{{ h.price }}</div>
          </div>
        </sc-for>
      </div>
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <div role="row" style="background:#faf7f5; border-top:1px solid #eee7e2;">
          <div role="rowheader" style="padding:12px 24px; font-size:13px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:#4a4550;">{{ g.title }}</div>
        </div>
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
          <div role="row" style="display:grid; grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr)); border-top:1px solid #f0ebe7;">
            <div role="rowheader" style="padding:15px 24px; font-size:16px; font-weight:600; line-height:1.4;">{{ r.label }}</div>
            <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="3">
              <div role="cell" style="padding:15px 14px; display:flex; justify-content:center; align-items:center; text-align:center; font-size:15px; font-weight:700; line-height:1.35; background:{{ c.bg }};">
                <sc-if value="{{ c.yes }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b3006b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;">Included</span></sc-if>
                <sc-if value="{{ c.no }}"><span aria-hidden="true" style="color:#8a8189;">—</span><span style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;">Not included</span></sc-if>
                <sc-if value="{{ c.text }}"><span>{{ c.text }}</span></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div role="group" aria-label="Choose a plan to compare" style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:6px; background:#f1ece8; border-radius:999px;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{ t.pressed }}" onClick="{{ t.select }}" style="appearance:none; border:0; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700; min-height:48px; border-radius:999px; background:{{ t.bg }}; color:{{ t.color }};" style-focus="outline:3px solid #ec008c; outline-offset:2px;">{{ t.name }}</button>
        </sc-for>
      </div>
      <div style="border:1px solid #e7e2de; border-radius:20px; background:#fff; overflow:hidden;">
        <div style="padding:18px 20px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; border-bottom:1px solid #e7e2de;">
          <span style="font-size:20px; font-weight:800;">{{ current.name }}</span>
          <span style="font-size:16px; font-weight:700; color:#4a4550;">{{ current.price }}</span>
        </div>
        <sc-for list="{{ mobileGroups }}" as="g" hint-placeholder-count="4">
          <div style="padding:10px 20px; background:#faf7f5; font-size:13px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:#4a4550; border-top:1px solid #eee7e2;">{{ g.title }}</div>
          <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 20px; border-top:1px solid #f0ebe7;">
              <span style="font-size:15px; font-weight:600; line-height:1.4;">{{ r.label }}</span>
              <span style="flex:none; max-width:46%; text-align:right; font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px;">
                <sc-if value="{{ r.yes }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b3006b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Included</sc-if>
                <sc-if value="{{ r.no }}"><span style="color:#6b6470; font-weight:600;">Not included</span></sc-if>
                <sc-if value="{{ r.text }}">{{ r.text }}</sc-if>
              </span>
            </div>
          </sc-for>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:900},&quot;plans&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string;price:string}[]&quot;},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title:string;rows:{label:string;v:(boolean|string)[]}[]}[]&quot;},&quot;highlight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { tab: null };
  renderVals() {
    const plans = this.props.plans || [];
    const groups = this.props.groups || [];
    const hl = this.props.highlight ?? 1;
    const tab = this.state.tab ?? hl;
    const tint = i => (i === hl ? '#fdeef6' : 'transparent');
    const cell = (v, i) => ({ yes: v === true, no: v === false, text: typeof v === 'string' ? v : '', bg: tint(i) });
    return {
      wide: !this.props.compact,
      narrow: !!this.props.compact,
      head: plans.map((p, i) => ({ ...p, bg: tint(i) })),
      groups: groups.map(g => ({ title: g.title, rows: g.rows.map(r => ({ label: r.label, cells: r.v.map(cell) })) })),
      tabs: plans.map((p, i) => ({ name: p.name, pressed: String(i === tab), bg: i === tab ? '#1b1720' : 'transparent', color: i === tab ? '#fff' : '#1b1720', select: () => this.setState({ tab: i }) })),
      current: plans[tab] || {},
      mobileGroups: groups.map(g => ({ title: g.title, rows: g.rows.map(r => ({ label: r.label, ...cell(r.v[tab], -1) })) }))
    };
  }
}
</script>
</body>
</html>
