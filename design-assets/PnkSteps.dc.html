<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<ol style="list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:20px; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:#1b1720;">
  <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
    <li style="background:#fff; border:1px solid #e7e2de; border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <span style="width:48px; height:48px; border-radius:50%; background:#fdeef6; color:#b3006b; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800;">{{ s.n }}</span>
        <span style="font-size:14px; font-weight:700; color:#4a4550; background:#faf7f5; padding:6px 12px; border-radius:999px;">{{ s.when }}</span>
      </div>
      <h3 style="margin:0; font-size:22px; font-weight:800; letter-spacing:-0.02em;">{{ s.title }}</h3>
      <p style="margin:0; font-size:16px; line-height:1.6; color:#4a4550; text-wrap:pretty;">{{ s.body }}</p>
      <sc-if value="{{ s.points }}" hint-placeholder-val="{{ false }}">
        <ul style="list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;">
          <sc-for list="{{ s.points }}" as="p" hint-placeholder-count="0">
            <li style="display:flex; gap:10px; align-items:flex-start; font-size:15px; font-weight:600; line-height:1.45;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3006b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none; margin-top:3px;"><path d="m5 12 5 5 9-10"></path></svg>{{ p }}</li>
          </sc-for>
        </ul>
      </sc-if>
    </li>
  </sc-for>
</ol>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:360},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title:string;when:string;body:string;points?:string[]}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const def = [
      { title: 'Free tech review', when: '30 minutes, free', body: "A video call to look at your website, email, accounts and security. You'll get a short, plain-English summary of what needs attention." },
      { title: 'Onboarding', when: 'Within two weeks', body: 'We document your setup — who has access to what, and where everything lives — and fix anything urgent straight away.' },
      { title: 'Ongoing support', when: 'Every month', body: "Email or use the support form whenever you need something. You'll get an update on every request, from start to finish." }
    ];
    return { steps: (this.props.steps || def).map((s, i) => ({ ...s, n: i + 1, points: s.points && s.points.length ? s.points : null })) };
  }
}
</script>
</body>
</html>
