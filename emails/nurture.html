<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title>Quick thought</title>
  <style>
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .mobile-padding { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

<!-- Preheader -->
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
  {{preheader_text}}
</div>

<!-- Outer wrapper -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f4f4;">
<tr><td align="center" style="padding: 20px 10px;">

<!-- Email container -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="email-container" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">

<tr>
<td style="padding: 40px 40px 36px 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 24px; color: #333333;" class="mobile-padding">

<p style="margin: 0 0 16px 0;">Hi {{first_name}},</p>

<p style="margin: 0 0 16px 0;">{{value_content}}</p>

<p style="margin: 0 0 16px 0;">{{value_detail}}</p>

<p style="margin: 0 0 16px 0;">{{soft_cta}}</p>

<p style="margin: 0 0 24px 0;">Cheers,<br>Mike</p>

<!-- Simple signature line -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr><td style="border-top: 1px solid #e4e4e7; padding-top: 16px; font-size: 13px; color: #a1a1aa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <p style="margin: 0 0 2px 0; color: #333333; font-weight: 600;">Mike Pink</p>
    <p style="margin: 0 0 2px 0; color: #f4178c;">PNK Digital</p>
    <p style="margin: 0 0 2px 0;">
      <a href="https://pnk-digital.com" style="color: #a1a1aa; text-decoration: none;">pnk-digital.com</a>
      &nbsp;&middot;&nbsp;
      <a href="mailto:mike@pnk-digital.com" style="color: #a1a1aa; text-decoration: none;">mike@pnk-digital.com</a>
    </p>
    <p style="margin: 8px 0 0 0; font-size: 11px;">
      <a href="{{unsubscribe_url}}" style="color: #999999; text-decoration: underline;">Unsubscribe</a>
    </p>
  </td></tr>
</table>

</td>
</tr>

</table>
</td></tr>
</table>

</body>
</html>
